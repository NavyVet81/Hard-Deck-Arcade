<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORTIE 01 // CENTIPEDE // THE HARD DECK ARCADE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #e6f2ff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .top-bar {
      width: 100%;
      background: rgba(8, 14, 28, 0.95);
      border-bottom: 1px solid #00f3ff;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }
    .back-btn {
      background: #ff9e00;
      color: #050711;
      text-decoration: none;
      padding: 5px 12px;
      font-weight: bold;
      border-radius: 4px;
    }
    .back-btn:hover { filter: brightness(1.15); }
    .title-tag { color: #00f3ff; font-weight: bold; letter-spacing: 1px; }
    .controls-tag { color: #00ff66; }
    .game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      width: 100%;
    }
    canvas {
      background: #02040a;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.35);
      max-width: 100%;
      height: auto;
      display: block;
    }
    .hud-strip {
      margin-top: 8px;
      display: flex;
      gap: 20px;
      font-size: 0.95rem;
      color: #ffd700;
    }
    button.arcade-btn {
      margin-top: 10px;
      background: #00ff66;
      color: #040812;
      border: none;
      padding: 8px 18px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../index.html" class="back-btn">&larr; HARD DECK</a>
    <span class="title-tag">SORTIE 01 // CENTIPEDE</span>
    <span class="controls-tag">ARROWS/WASD: MOVE | SPACE: FIRE | R: RESTART</span>
  </div>
  <div class="game-wrap">
    <canvas id="c" width="600" height="640"></canvas><div class="hud-strip"><span id="sc">SCORE: 0</span><span id="lv">LIVES: 3</span></div>
  </div>
  <script>
    
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const G = 20, COLS = 30, ROWS = 32;
    let player, bullets, mushrooms, centipede, score, lives, gameOver, keys = {};
    function init() {
      player = { x: 290, y: 580, r: 8 };
      bullets = []; mushrooms = []; centipede = [];
      score = 0; lives = 3; gameOver = false;
      for (let i = 0; i < 45; i++) {
        mushrooms.push({ col: Math.floor(Math.random()*COLS), row: 2 + Math.floor(Math.random()*(ROWS-7)), hp: 4 });
      }
      spawnCentipede(12);
    }
    function spawnCentipede(len) {
      centipede = [];
      for (let i = 0; i < len; i++) {
        centipede.push({ x: (14 - i)*G + 10, y: 10, dx: 2.6, dy: G, dirY: 1 });
      }
    }
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') { e.preventDefault(); if (!gameOver && bullets.length < 4) bullets.push({ x: player.x, y: player.y - 10 }); }
      if (e.key.toLowerCase() === 'r') init();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);
    function update() {
      if (gameOver) return;
      if ((keys['ArrowLeft'] || keys['a']) && player.x > 12) player.x -= 4;
      if ((keys['ArrowRight'] || keys['d']) && player.x < c.width - 12) player.x += 4;
      if ((keys['ArrowUp'] || keys['w']) && player.y > 460) player.y -= 4;
      if ((keys['ArrowDown'] || keys['s']) && player.y < c.height - 12) player.y += 4;

      bullets.forEach(b => b.y -= 9);
      bullets = bullets.filter(b => b.y > 0);

      // Bullet vs Mushroom
      bullets.forEach((b, bi) => {
        mushrooms.forEach((m, mi) => {
          const mx = m.col*G + 10, my = m.row*G + 10;
          if (Math.hypot(b.x - mx, b.y - my) < 12) {
            bullets.splice(bi, 1);
            m.hp--;
            if (m.hp <= 0) { mushrooms.splice(mi, 1); score += 5; }
          }
        });
      });

      // Move Centipede
      centipede.forEach((seg, si) => {
        seg.x += seg.dx;
        const col = Math.floor(seg.x / G), row = Math.floor(seg.y / G);
        const hitWall = seg.x < 10 || seg.x > c.width - 10;
        const hitMush = mushrooms.some(m => m.col === col && m.row === row);
        if (hitWall || hitMush) {
          seg.dx *= -1;
          seg.x += seg.dx * 2;
          seg.y += seg.dirY * G;
          if (seg.y > c.height - 20) seg.dirY = -1;
          if (seg.y < 20) seg.dirY = 1;
        }
        if (Math.hypot(seg.x - player.x, seg.y - player.y) < 15) {
          lives--;
          player.x = 290; player.y = 580;
          if (lives <= 0) gameOver = true;
        }
        bullets.forEach((b, bi) => {
          if (Math.hypot(b.x - seg.x, b.y - seg.y) < 12) {
            bullets.splice(bi, 1);
            mushrooms.push({ col: Math.floor(seg.x/G), row: Math.floor(seg.y/G), hp: 4 });
            centipede.splice(si, 1);
            score += 100;
          }
        });
      });
      if (centipede.length === 0) spawnCentipede(14);
      document.getElementById('sc').textContent = 'SCORE: ' + score;
      document.getElementById('lv').textContent = 'LIVES: ' + lives;
    }
    function draw() {
      ctx.fillStyle = '#03060f'; ctx.fillRect(0, 0, c.width, c.height);
      mushrooms.forEach(m => {
        ctx.fillStyle = m.hp > 2 ? '#ff9e00' : '#ff2a55';
        ctx.beginPath(); ctx.arc(m.col*G + 10, m.row*G + 10, 7, Math.PI, 0); ctx.fill();
        ctx.fillRect(m.col*G + 7, m.row*G + 10, 6, 5);
      });
      centipede.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#ff2a55' : '#00ff66';
        ctx.beginPath(); ctx.arc(seg.x, seg.y, 9, 0, Math.PI*2); ctx.fill();
      });
      ctx.fillStyle = '#00f3ff';
      ctx.beginPath(); ctx.moveTo(player.x, player.y-12); ctx.lineTo(player.x-9, player.y+10); ctx.lineTo(player.x+9, player.y+10); ctx.fill();
      ctx.fillStyle = '#ffd700';
      bullets.forEach(b => ctx.fillRect(b.x - 2, b.y - 6, 4, 12));
      if (gameOver) {
        ctx.fillStyle = '#ff2a55'; ctx.font = 'bold 34px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('MISSION FAILED - PRESS R', c.width/2, c.height/2);
      }
    }
    init();
    setInterval(() => { update(); draw(); }, 1000/60);
    
  </script>
</body>
</html>
