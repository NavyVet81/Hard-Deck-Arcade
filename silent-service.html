<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORTIE 04 // SILENT SERVICE (NAVY SUBMARINE COMMAND) // THE HARD DECK ARCADE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #e6f2ff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .top-bar {
      width: 100%;
      background: rgba(8, 14, 28, 0.95);
      border-bottom: 1px solid #00f3ff;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }
    .back-btn {
      background: #ff9e00;
      color: #050711;
      text-decoration: none;
      padding: 5px 12px;
      font-weight: bold;
      border-radius: 4px;
    }
    .back-btn:hover { filter: brightness(1.15); }
    .title-tag { color: #00f3ff; font-weight: bold; letter-spacing: 1px; }
    .controls-tag { color: #00ff66; }
    .game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      width: 100%;
    }
    canvas {
      background: #02040a;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.35);
      max-width: 100%;
      height: auto;
      display: block;
    }
    .hud-strip {
      margin-top: 8px;
      display: flex;
      gap: 20px;
      font-size: 0.95rem;
      color: #ffd700;
    }
    button.arcade-btn {
      margin-top: 10px;
      background: #00ff66;
      color: #040812;
      border: none;
      padding: 8px 18px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../index.html" class="back-btn">&larr; HARD DECK</a>
    <span class="title-tag">SORTIE 04 // SILENT SERVICE (NAVY SUBMARINE COMMAND)</span>
    <span class="controls-tag">LEFT/RIGHT: RUDDER | UP/DOWN: SPEED | SPACE: FIRE TORPEDO | P: ACTIVE PING</span>
  </div>
  <div class="game-wrap">
    <canvas id="c" width="700" height="520"></canvas><div class="hud-strip"><span id="hd">HDG: 000</span><span id="sp">SPD: 12 KTS</span><span id="tp">TORPEDOES: 6</span><span id="sc">TONNAGE: 0 TONS</span></div>
  </div>
  <script>
    
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let sub, torpedoes, targets, sweep, pingAlpha, tonnage, keys = {};
    function init() {
      sub = { x: 350, y: 260, angle: -Math.PI/2, speed: 1.2, torps: 6 };
      torpedoes = []; targets = []; sweep = 0; pingAlpha = 0; tonnage = 0;
      for (let i = 0; i < 4; i++) spawnTarget();
    }
    function spawnTarget() {
      const ang = Math.random()*Math.PI*2;
      targets.push({
        x: 350 + Math.cos(ang)*210,
        y: 260 + Math.sin(ang)*210,
        vx: (Math.random()-0.5)*0.7,
        vy: (Math.random()-0.5)*0.7,
        tons: (4 + Math.floor(Math.random()*8))*1000,
        detected: 0.4
      });
    }
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        if (sub.torps > 0) {
          sub.torps--;
          torpedoes.push({ x: sub.x, y: sub.y, angle: sub.angle, life: 220 });
        }
      }
      if (e.key.toLowerCase() === 'p') {
        pingAlpha = 1.0;
        targets.forEach(t => t.detected = 1.0);
      }
      if (e.key.toLowerCase() === 'r') init();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);
    function update() {
      if (keys['ArrowLeft'] || keys['a']) sub.angle -= 0.03;
      if (keys['ArrowRight'] || keys['d']) sub.angle += 0.03;
      if (keys['ArrowUp'] || keys['w']) sub.speed = Math.min(2.5, sub.speed + 0.03);
      if (keys['ArrowDown'] || keys['s']) sub.speed = Math.max(0.2, sub.speed - 0.03);

      sub.x = Math.max(40, Math.min(660, sub.x + Math.cos(sub.angle)*sub.speed));
      sub.y = Math.max(40, Math.min(480, sub.y + Math.sin(sub.angle)*sub.speed));
      sweep = (sweep + 0.035) % (Math.PI*2);
      if (pingAlpha > 0) pingAlpha -= 0.015;

      targets.forEach((t, ti) => {
        t.x += t.vx; t.y += t.vy;
        if (t.x < 40 || t.x > 660) t.vx *= -1;
        if (t.y < 40 || t.y > 480) t.vy *= -1;
        const angToTarget = Math.atan2(t.y - sub.y, t.x - sub.x);
        const diff = Math.abs(((angToTarget - sweep + Math.PI*3) % (Math.PI*2)) - Math.PI);
        if (diff < 0.08) t.detected = 1.0;
        else t.detected = Math.max(0.18, t.detected - 0.004);
      });

      torpedoes.forEach((tp, pi) => {
        tp.x += Math.cos(tp.angle)*3.6;
        tp.y += Math.sin(tp.angle)*3.6;
        tp.life--;
        targets.forEach((t, ti) => {
          if (Math.hypot(tp.x - t.x, tp.y - t.y) < 16) {
            tonnage += t.tons;
            targets.splice(ti, 1);
            torpedoes.splice(pi, 1);
            sub.torps += 2;
            spawnTarget();
          }
        });
      });
      torpedoes = torpedoes.filter(tp => tp.life > 0);

      const deg = Math.round(((sub.angle * 180 / Math.PI) + 450) % 360);
      document.getElementById('hd').textContent = 'HDG: ' + String(deg).padStart(3, '0') + '°';
      document.getElementById('sp').textContent = 'SPD: ' + Math.round(sub.speed*10) + ' KTS';
      document.getElementById('tp').textContent = 'TORPEDOES: ' + sub.torps;
      document.getElementById('sc').textContent = 'TONNAGE: ' + tonnage.toLocaleString() + ' TONS';
    }
    function draw() {
      ctx.fillStyle = '#020b06'; ctx.fillRect(0, 0, c.width, c.height);
      // Sonar Rings centered on sub
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.25)'; ctx.lineWidth = 1;
      [70, 140, 210, 280].forEach(r => { ctx.beginPath(); ctx.arc(sub.x, sub.y, r, 0, Math.PI*2); ctx.stroke(); });
      if (pingAlpha > 0) {
        ctx.strokeStyle = 'rgba(0, 243, 255,' + pingAlpha + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(sub.x, sub.y, (1 - pingAlpha)*280, 0, Math.PI*2); ctx.stroke();
      }
      // Sweep line
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.75)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sub.x, sub.y); ctx.lineTo(sub.x + Math.cos(sweep)*290, sub.y + Math.sin(sweep)*290); ctx.stroke();

      // Targets
      targets.forEach(t => {
        ctx.fillStyle = 'rgba(255, 158, 0,' + t.detected + ')';
        ctx.fillRect(t.x - 8, t.y - 5, 16, 10);
        ctx.font = '11px Courier New';
        ctx.fillText(t.tons + 'T', t.x + 10, t.y + 4);
      });

      // Torpedoes
      ctx.fillStyle = '#00f3ff';
      torpedoes.forEach(tp => { ctx.beginPath(); ctx.arc(tp.x, tp.y, 3, 0, Math.PI*2); ctx.fill(); });

      // Sub icon
      ctx.save(); ctx.translate(sub.x, sub.y); ctx.rotate(sub.angle);
      ctx.fillStyle = '#00ff66';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, -6); ctx.lineTo(-10, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    init();
    setInterval(() => { update(); draw(); }, 1000/60);
    
  </script>
</body>
</html>
