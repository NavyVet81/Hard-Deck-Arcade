<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORTIE 08 // TIMBER TILT // THE HARD DECK ARCADE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #e6f2ff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .top-bar {
      width: 100%;
      background: rgba(8, 14, 28, 0.95);
      border-bottom: 1px solid #00f3ff;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }
    .back-btn {
      background: #ff9e00;
      color: #050711;
      text-decoration: none;
      padding: 5px 12px;
      font-weight: bold;
      border-radius: 4px;
    }
    .back-btn:hover { filter: brightness(1.15); }
    .title-tag { color: #00f3ff; font-weight: bold; letter-spacing: 1px; }
    .controls-tag { color: #00ff66; }
    .game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      width: 100%;
    }
    canvas {
      background: #02040a;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.35);
      max-width: 100%;
      height: auto;
      display: block;
    }
    .hud-strip {
      margin-top: 8px;
      display: flex;
      gap: 20px;
      font-size: 0.95rem;
      color: #ffd700;
    }
    button.arcade-btn {
      margin-top: 10px;
      background: #00ff66;
      color: #040812;
      border: none;
      padding: 8px 18px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../index.html" class="back-btn">&larr; HARD DECK</a>
    <span class="title-tag">SORTIE 08 // TIMBER TILT</span>
    <span class="controls-tag">CLICK CELL TO PLACE TIMBER | CLEAR ROWS & COLUMNS TO SPLIT KNOTS</span>
  </div>
  <div class="game-wrap">
    <canvas id="c" width="480" height="480"></canvas><div class="hud-strip"><span id="sc">SCORE: 0</span><span id="kn">KNOTS CLEARED: 0</span></div><button class="arcade-btn" onclick="init()">NEW BOARD</button>
  </div>
  <script>
    
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const N = 8, S = 60;
    let board, score, knotsCleared;
    function init() {
      board = Array.from({length: N}, () => Array(N).fill(0));
      score = 0; knotsCleared = 0;
      for (let i = 0; i < 10; i++) {
        const r = Math.floor(Math.random()*N), col = Math.floor(Math.random()*N);
        board[r][col] = 2; // 2 = Knot (takes 2 line clears)
      }
      draw();
    }
    c.addEventListener('click', e => {
      const rect = c.getBoundingClientRect();
      const col = Math.floor(((e.clientX - rect.left) / rect.width) * N);
      const row = Math.floor(((e.clientY - rect.top) / rect.height) * N);
      if (row >= 0 && row < N && col >= 0 && col < N && board[row][col] === 0) {
        board[row][col] = 1;
        score += 10;
        checkLines();
        draw();
      }
    });
    function checkLines() {
      const fullRows = [], fullCols = [];
      for (let r = 0; r < N; r++) if (board[r].every(v => v > 0)) fullRows.push(r);
      for (let col = 0; col < N; col++) {
        let full = true;
        for (let r = 0; r < N; r++) if (board[r][col] === 0) full = false;
        if (full) fullCols.push(col);
      }
      fullRows.forEach(r => {
        for (let col = 0; col < N; col++) {
          if (board[r][col] === 2) { board[r][col] = 1; knotsCleared++; score += 100; }
          else { board[r][col] = 0; score += 25; }
        }
      });
      fullCols.forEach(col => {
        for (let r = 0; r < N; r++) {
          if (board[r][col] === 2) { board[r][col] = 1; knotsCleared++; score += 100; }
          else { board[r][col] = 0; score += 25; }
        }
      });
      document.getElementById('sc').textContent = 'SCORE: ' + score;
      document.getElementById('kn').textContent = 'KNOTS CLEARED: ' + knotsCleared;
    }
    function draw() {
      ctx.fillStyle = '#050914'; ctx.fillRect(0, 0, 480, 480);
      for (let r = 0; r < N; r++) {
        for (let col = 0; col < N; col++) {
          ctx.strokeStyle = '#1e3a5f'; ctx.strokeRect(col*S + 2, r*S + 2, S - 4, S - 4);
          if (board[r][col] === 1) {
            ctx.fillStyle = '#ff9e00'; ctx.fillRect(col*S + 6, r*S + 6, S - 12, S - 12);
          } else if (board[r][col] === 2) {
            ctx.fillStyle = '#ff2a55'; ctx.fillRect(col*S + 6, r*S + 6, S - 12, S - 12);
            ctx.strokeStyle = '#ffd700'; ctx.beginPath(); ctx.arc(col*S + 30, r*S + 30, 12, 0, Math.PI*2); ctx.stroke();
          }
        }
      }
    }
    init();
    
  </script>
</body>
</html>
