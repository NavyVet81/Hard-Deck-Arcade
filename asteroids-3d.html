<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORTIE 06 // ASTEROIDS 3D COCKPIT // THE HARD DECK ARCADE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #e6f2ff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .top-bar {
      width: 100%;
      background: rgba(8, 14, 28, 0.95);
      border-bottom: 1px solid #00f3ff;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }
    .back-btn {
      background: #ff9e00;
      color: #050711;
      text-decoration: none;
      padding: 5px 12px;
      font-weight: bold;
      border-radius: 4px;
    }
    .back-btn:hover { filter: brightness(1.15); }
    .title-tag { color: #00f3ff; font-weight: bold; letter-spacing: 1px; }
    .controls-tag { color: #00ff66; }
    .game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      width: 100%;
    }
    canvas {
      background: #02040a;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.35);
      max-width: 100%;
      height: auto;
      display: block;
    }
    .hud-strip {
      margin-top: 8px;
      display: flex;
      gap: 20px;
      font-size: 0.95rem;
      color: #ffd700;
    }
    button.arcade-btn {
      margin-top: 10px;
      background: #00ff66;
      color: #040812;
      border: none;
      padding: 8px 18px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../index.html" class="back-btn">&larr; HARD DECK</a>
    <span class="title-tag">SORTIE 06 // ASTEROIDS 3D COCKPIT</span>
    <span class="controls-tag">ARROWS/WASD: STEER | SPACE: TWIN CANNONS | R: RESTART</span>
  </div>
  <div class="game-wrap">
    <canvas id="c" width="760" height="500"></canvas><div class="hud-strip"><span id="sc">SCORE: 0</span><span id="hl">HULL: 100%</span></div>
  </div>
  <script>
    
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let rocks, bolts, score, hull, gameOver, keys = {};
    function init() {
      rocks = []; bolts = []; score = 0; hull = 100; gameOver = false;
      for (let i = 0; i < 14; i++) spawnRock(200 + Math.random()*700);
    }
    function spawnRock(z = 900) {
      rocks.push({ x: (Math.random()-0.5)*700, y: (Math.random()-0.5)*460, z, rot: Math.random()*6 });
    }
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') { e.preventDefault(); if (!gameOver) bolts.push({ z: 40 }); }
      if (e.key.toLowerCase() === 'r') init();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);
    function update() {
      if (gameOver) return;
      const vx = (keys['ArrowLeft'] || keys['a']) ? 5 : (keys['ArrowRight'] || keys['d']) ? -5 : 0;
      const vy = (keys['ArrowUp'] || keys['w']) ? 5 : (keys['ArrowDown'] || keys['s']) ? -5 : 0;

      rocks.forEach((r, ri) => {
        r.x += vx; r.y += vy; r.z -= 4.5; r.rot += 0.02;
        if (r.z < 45) {
          if (Math.hypot(r.x, r.y) < 85) {
            hull -= 25;
            if (hull <= 0) { hull = 0; gameOver = true; }
          }
          rocks.splice(ri, 1); spawnRock();
        }
      });

      bolts.forEach((b, bi) => {
        b.z += 28;
        rocks.forEach((r, ri) => {
          if (Math.abs(b.z - r.z) < 40 && Math.hypot(r.x, r.y) < 70) {
            rocks.splice(ri, 1); bolts.splice(bi, 1); score += 100; spawnRock();
          }
        });
      });
      bolts = bolts.filter(b => b.z < 900);
      document.getElementById('sc').textContent = 'SCORE: ' + score;
      document.getElementById('hl').textContent = 'HULL: ' + hull + '%';
    }
    function draw() {
      ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, 760, 500);
      rocks.sort((a,b) => b.z - a.z).forEach(r => {
        const sx = 380 + (r.x / r.z)*360, sy = 250 + (r.y / r.z)*360, rad = Math.max(6, 18000/r.z);
        ctx.strokeStyle = '#ff9e00'; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 7; i++) {
          const a = r.rot + (i/7)*Math.PI*2;
          const dist = rad * (0.8 + (i%2)*0.3);
          const px = sx + Math.cos(a)*dist, py = sy + Math.sin(a)*dist;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      });
      bolts.forEach(b => {
        const s = 14000 / b.z;
        ctx.fillStyle = '#00ff66';
        ctx.fillRect(380 - s, 250 + s*0.3, 6, 6);
        ctx.fillRect(380 + s, 250 + s*0.3, 6, 6);
      });
      // Center Crosshair & Cockpit
      ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(355, 225, 50, 50);
      ctx.beginPath(); ctx.moveTo(380, 215); ctx.lineTo(380, 285); ctx.moveTo(345, 250); ctx.lineTo(415, 250); ctx.stroke();
      if (gameOver) {
        ctx.fillStyle = '#ff2a55'; ctx.font = 'bold 36px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('ASTEROID IMPACT - PRESS R', 380, 250);
      }
    }
    init();
    setInterval(() => { update(); draw(); }, 1000/60);
    
  </script>
</body>
</html>
