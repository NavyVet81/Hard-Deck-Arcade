<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORTIE 02 // GALAGA 3D // THE HARD DECK ARCADE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #e6f2ff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .top-bar {
      width: 100%;
      background: rgba(8, 14, 28, 0.95);
      border-bottom: 1px solid #00f3ff;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }
    .back-btn {
      background: #ff9e00;
      color: #050711;
      text-decoration: none;
      padding: 5px 12px;
      font-weight: bold;
      border-radius: 4px;
    }
    .back-btn:hover { filter: brightness(1.15); }
    .title-tag { color: #00f3ff; font-weight: bold; letter-spacing: 1px; }
    .controls-tag { color: #00ff66; }
    .game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      width: 100%;
    }
    canvas {
      background: #02040a;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.35);
      max-width: 100%;
      height: auto;
      display: block;
    }
    .hud-strip {
      margin-top: 8px;
      display: flex;
      gap: 20px;
      font-size: 0.95rem;
      color: #ffd700;
    }
    button.arcade-btn {
      margin-top: 10px;
      background: #00ff66;
      color: #040812;
      border: none;
      padding: 8px 18px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../index.html" class="back-btn">&larr; HARD DECK</a>
    <span class="title-tag">SORTIE 02 // GALAGA 3D</span>
    <span class="controls-tag">ARROWS/WASD: AIM RETICLE | SPACE: TWIN LASERS | R: RESTART</span>
  </div>
  <div class="game-wrap">
    <canvas id="c" width="760" height="500"></canvas><div class="hud-strip"><span id="sc">SCORE: 0</span><span id="sh">SHIELDS: 100%</span></div>
  </div>
  <script>
    
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let aim, enemies, lasers, stars, score, shields, gameOver, keys = {};
    function init() {
      aim = { x: 380, y: 250 }; enemies = []; lasers = []; stars = [];
      score = 0; shields = 100; gameOver = false;
      for (let i = 0; i < 90; i++) stars.push({ x: (Math.random()-0.5)*900, y: (Math.random()-0.5)*700, z: Math.random()*800 + 50 });
    }
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') { e.preventDefault(); if (!gameOver) { lasers.push({ tx: aim.x, ty: aim.y, t: 1 }); checkHit(); } }
      if (e.key.toLowerCase() === 'r') init();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);
    function checkHit() {
      enemies.forEach((en, i) => {
        const sx = 380 + (en.x / en.z)*320, sy = 250 + (en.y / en.z)*320, rad = Math.max(10, 14000/en.z);
        if (Math.hypot(aim.x - sx, aim.y - sy) < rad + 12) {
          enemies.splice(i, 1);
          score += 150;
        }
      });
    }
    function update() {
      if (gameOver) return;
      if ((keys['ArrowLeft'] || keys['a']) && aim.x > 40) aim.x -= 7;
      if ((keys['ArrowRight'] || keys['d']) && aim.x < 720) aim.x += 7;
      if ((keys['ArrowUp'] || keys['w']) && aim.y > 40) aim.y -= 7;
      if ((keys['ArrowDown'] || keys['s']) && aim.y < 460) aim.y += 7;

      stars.forEach(s => { s.z -= 8; if (s.z <= 10) s.z = 850; });
      if (Math.random() < 0.03) {
        enemies.push({ x: (Math.random()-0.5)*500, y: (Math.random()-0.5)*320, z: 850, phase: Math.random()*6 });
      }
      enemies.forEach((en, i) => {
        en.z -= 4.2;
        en.phase += 0.06;
        en.x += Math.sin(en.phase) * 3;
        if (en.z < 55) {
          enemies.splice(i, 1);
          shields -= 20;
          if (shields <= 0) { shields = 0; gameOver = true; }
        }
      });
      lasers.forEach(l => l.t -= 0.15);
      lasers = lasers.filter(l => l.t > 0);
      document.getElementById('sc').textContent = 'SCORE: ' + score;
      document.getElementById('sh').textContent = 'SHIELDS: ' + shields + '%';
    }
    function draw() {
      ctx.fillStyle = '#02040b'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        const sx = 380 + (s.x / s.z)*320, sy = 250 + (s.y / s.z)*320;
        ctx.fillRect(sx, sy, 2, 2);
      });
      enemies.sort((a,b) => b.z - a.z).forEach(en => {
        const sx = 380 + (en.x / en.z)*320, sy = 250 + (en.y / en.z)*320, rad = Math.max(8, 12000/en.z);
        ctx.strokeStyle = '#ff2a55'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx, sy - rad); ctx.lineTo(sx + rad*1.3, sy); ctx.lineTo(sx, sy + rad*0.7); ctx.lineTo(sx - rad*1.3, sy); ctx.closePath(); ctx.stroke();
        ctx.fillStyle = '#ffd700'; ctx.fillRect(sx - 3, sy - 3, 6, 6);
      });
      lasers.forEach(l => {
        ctx.strokeStyle = 'rgba(0, 255, 102,' + l.t + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(80, 490); ctx.lineTo(l.tx, l.ty); ctx.moveTo(680, 490); ctx.lineTo(l.tx, l.ty); ctx.stroke();
      });
      // Cockpit HUD & Reticle
      ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(aim.x, aim.y, 20, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(aim.x - 28, aim.y); ctx.lineTo(aim.x + 28, aim.y); ctx.moveTo(aim.x, aim.y - 28); ctx.lineTo(aim.x, aim.y + 28); ctx.stroke();
      // Cockpit canopy frame
      ctx.strokeStyle = '#1d3557'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(0, 420); ctx.lineTo(140, 340); ctx.lineTo(620, 340); ctx.lineTo(760, 420); ctx.stroke();
      if (gameOver) {
        ctx.fillStyle = '#ff2a55'; ctx.font = 'bold 36px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('HULL BREACHED - PRESS R', 380, 250);
      }
    }
    init();
    setInterval(() => { update(); draw(); }, 1000/60);
    
  </script>
</body>
</html>
